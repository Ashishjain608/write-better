name: Bug report
description: Something in WriteBetter doesn't work as expected
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Please don't paste private text or API keys — a short made-up example is enough.
        Found a security problem? Report it privately instead: see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: And what did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Copy some text, press ⇧⌘Space
        2. …
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Shown in Settings (⌘,) → About.
      placeholder: "1.1.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version, Mac, provider and model
      placeholder: "macOS 15.2, Apple Silicon — provider and model: Anthropic, Claude Sonnet 5.5"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
      description: Optional. Drag images straight into this box.
